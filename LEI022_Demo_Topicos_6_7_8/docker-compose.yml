services:
  postgres:
    image: postgres:16
    container_name: lei022-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lei022_demo
    ports:
      - "5432:5432"
    volumes:
      - lei022_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lei022_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lei022_pgdata:
